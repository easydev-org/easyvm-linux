name: ubuntu

# ubuntu, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE LEGS USED TO RUN AS ONE PARALLEL MATRIX, and that produced a race with a timeout for a tail: a leg
# asks for the tag the leg before it publishes, gets a 404 because that leg is still running, falls back
# to the INSTALL disk - which has no sshd - and spends its whole budget on a machine that could never
# answer.
#
# `needs:` IS THE FIX, AND IT IS WHAT THE REFERENCE IMPLEMENTATION ALWAYS DID:
#
#	jobs/bake  ->  jobs/launch needs bake  ->  jobs/ssh needs bake  ->  jobs/vm-configure needs ssh
#
# A leg cannot start before the artifact it pulls exists, because it is not SCHEDULED until then. The
# cost is the sum rather than the maximum, and that is the right way round: a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#

on:
  # ONE STAGE, DISPATCHED BY HAND. This was a job inside `ubuntu.yml`, where `needs:` decided the
  # order; each stage is its own workflow now.
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-linux"
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default linux-ubuntu)
        default: "linux-ubuntu"
      python_stage:
        description: >-
          true runs the PYTHON walkthrough (`stage-python.yml`); false runs the old `.walk` through
          `stage.yml`. It is an input rather than a replacement so the two can be measured against
          the same disk in the same week - see docs/V0.0.5-DESIGN.md.
        type: boolean
        default: true

concurrency:
  group: ubuntu-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  # = THE PYTHON PATH ==================================================================
  #
  # TWO CONTAINERS: the daemon (easyvm, with /dev/kvm) and the steps (easyvm-client, python). The
  # walkthrough is `ubuntu/steps/ssh.py`, and the arrangement is the one probe-two-containers
  # measured - see the comment at the top of stage-python.yml.
  ssh-python:
    if: inputs.python_stage
    uses: easydev-org/easyvm/.github/workflows/stage-python.yml@v0.0.5-rc
    secrets: inherit
    with:
      daemon_image_tag: v0.0.5-rc
      client_image_tag: v0.0.5
      group: ubuntu-ssh
      disks_repository: ${{ inputs.disks_repository }}
      user: vmuser
      password: admin1
      stages: |
        [
          {
            "name": "linux-ubuntu-ssh",
            "script": "ubuntu/steps/ssh.py",
            "pull": "${{ inputs.from_tag }}",
            "out": "linux-ubuntu-ssh.qcow2",
            "publish": "linux-ubuntu-ssh",
            "seed": "true",
            "seed-family": "apt",
            "timeout": 60
          }
        ]

  # = THE OLD PATH, KEPT UNTIL THE PYTHON ONE HAS A GREEN RUN ============================
  #
  # The `.walk` file and `stage.yml` still work; deleting them is the LAST step of v0.0.5, not the
  # first. A caller that turns `python_stage` off measures the same disk through the old engine, which
  # is how a difference between the two is told apart from a difference in the disk.
  ssh-walk:
    if: ${{ !inputs.python_stage }}
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      # THE DAEMON'S SSH CLIENT NEEDS THE PASSWORD AS A FLAG.
      #
      # MEASURED (lab pod, this image, this disk): `walk.File` has NO password field -
      # `password admin1` only feeds `{{ password }}` substitution - and stage.yml passes
      # `--password` to `easyvm run` only when this input is non-empty. Without it `easyvm
      # run`'s own default ("admin") reaches the daemon and overrides nothing but IS what
      # the ssh client dials with, while the disk's account is `admin1`. The result is a
      # machine whose sshd is active and listening, whose guest-side commands all worked,
      # and whose every probe and `ssh:` step answers
      #
      #	ssh: handshake failed: unable to authenticate, attempted methods [none password],
      #	no supported methods remain
      #
      # - reproduced in the pod with the engine's own client: `admin1` succeeded and the
      # default failed on the very same guest. anduinos and pearos pass because their
      # workflows already spell it out.
      password: "admin1"
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "20"
      group: ubuntu-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-ubuntu-ssh",
            "file": "ubuntu/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "linux-ubuntu-ssh.qcow2",
            "publish": "linux-ubuntu-ssh",
            "seed": "true",
            "seed-family": "apt",
            "timeout": 60
          }
        ]