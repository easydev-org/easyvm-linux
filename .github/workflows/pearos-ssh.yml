name: pearos-ssh

# THE STAGE THAT PROVES THE MACHINE, AND FOR THIS DISTRIBUTION IT IS THE HARDEST ONE.
#
# pearOS publishes a disk with NO ACCOUNT THE INSTALLER CREATED FOR THE USER: its Calamares sequence
# has no `users` page, and the `default` account it does create is scheduled for deletion by the
# first-boot wizard. So this stage is not "boot it and knock" - it drives the wizard to its end, waits
# for the desktop that wizard produces, turns sshd on from that desktop, and only then knocks.
#
# THERE IS NO `Remote Login` PANEL TO FIND. macOS answers this with a switch in Sharing; pearOS is
# Arch with KDE, so sshd is a unit that ships disabled and is started with `systemctl enable --now`.
#
# `concurrency:` IS PER WORKFLOW, so dispatching `ubuntu` cannot cancel `ghostbsd` or `windows`. A single
# file holding every stage meant DISPATCHING A LINUX FIX CANCELLED A RUNNING WINDOWS INSTALL - measured,
# forty minutes of one thrown away. The group exists to stop two runs fighting over one machine, and a
# matrix leg is not one machine: every leg gets its own runner.
#
# AND THE MECHANISM IS NOT COPIED. The container options, the device probes, the pull, the daemon and
# the follow loop live once in `stage.yml`, called with `workflow_call`. easydiskbake's 26 workflows
# repeat the same container stanza 23 times; that is the duplication this avoids.

on:
  # ONE STAGE, DISPATCHED BY HAND. This was a job inside `pearos.yml`, where `needs:` decided the
  # order; each stage is its own workflow now.
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-linux"
      from_tag:
        description: >-
          the PUBLISHED disk this stage continues from (default linux-pearos)
        default: "linux-pearos"

concurrency:
  group: pearos-ssh
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  ssh:
    uses: easydev-org/easyvm/.github/workflows/stage.yml@v0.0.4
    secrets: inherit
    with:
      image_repository: easydev-org/easyvm
      image_tag: v0.0.4
      disk_gb: "20"
      group: pearos-ssh
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-pearos-ssh",
            "file": "pearos/steps/ssh.walk",
            "pull": "${{ inputs.from_tag }}",
            "out": "linux-pearos-ssh.qcow2",
            "timeout": 60,
            "publish": "linux-pearos-ssh"
          }
        ]
